name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run core tests
        run: dotnet run --project tests/FootageVault.Core.Tests -c Release

      - name: Publish app
        run: >
          dotnet publish src/FootageVault.App/FootageVault.App.csproj
          -c Release -r win-x64 -p:Platform=x64 -p:Version=1.0.${{ github.run_number }}
          -o publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=1.0.${{ github.run_number }} /DSourceDir=..\publish installer\FootageVault.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootageVault-Setup-1.0.${{ github.run_number }}
          path: installer/Output/FootageVault-Setup.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag installer/Output/FootageVault-Setup.exe `
            --title "Footage Vault 1.0.${{ github.run_number }}" `
            --notes "Download FootageVault-Setup.exe below and run it." --latest
